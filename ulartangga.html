<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ular Tangga Kehidupan</title>
<style>
:root {
  --primary:#00BFA5; --on-primary:#00382F;
  --surface:#1A1F1E; --surface-2:#2A302F;
  --bg:#0B0E17; --on:#E0E3E2; --muted:#899390;
  --p1:#2196F3; --p2:#FF9800; --p3:#9C27B0; --p4:#E91E63; --p5:#4CAF50; --p6:#00BCD4;
  --gold:#FFC107;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Roboto',system-ui,sans-serif;
  background:radial-gradient(ellipse at bottom,#1B2735 0%,#090A0F 100%);
  color:var(--on); min-height:100dvh;
  display:flex; flex-direction:column; align-items:center;
  padding:8px; overflow-x:hidden; font-size:15px; position:relative;
}

/* Night sky stars */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{
  position:absolute; background:#fff; border-radius:50%;
  animation:twinkle var(--d) ease-in-out infinite;
}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.falling{
  position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
  box-shadow:0 0 6px 2px rgba(255,255,255,.7);
  animation:fallStar linear forwards;
}
@keyframes fallStar{
  0%{transform:translateY(0) translateX(0); opacity:1}
  100%{transform:translateY(100vh) translateX(40px); opacity:0}
}

h1, .sub, #game, #setup, .overlay{position:relative; z-index:1}
h1{font-size:1.4rem;font-weight:500;color:var(--primary);margin:4px 0 2px;text-align:center}
.sub{font-size:.75rem;color:var(--muted);margin-bottom:8px;text-align:center}

/* WELCOME - solid */
#setup{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:rgba(9,10,15,.88);
}
.card{
  background:var(--surface); border-radius:28px; padding:24px 20px;
  width:90%; max-width:340px;
  box-shadow:0 16px 40px rgba(0,0,0,.6);
  position:relative;
  animation:pop .4s cubic-bezier(.2,0,0,1);
}
/* Bold animated spectrum border */
.card::before{
  content:''; position:absolute; inset:-3px; border-radius:30px; z-index:-1;
  background:linear-gradient(90deg,#00BFA5,#2196F3,#9C27B0,#E91E63,#FF9800,#00BFA5);
  background-size:300% 100%;
  animation:spectrum 4s linear infinite;
}
@keyframes spectrum{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

.card h2{font-size:1.35rem;font-weight:500;color:var(--primary);text-align:center;margin-bottom:4px}
.card .slogan{font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:16px}
.sec{font-size:.82rem;font-weight:500;margin-bottom:8px;color:var(--on)}

/* 2 rows of 3 */
.p-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.p-btn{
  height:44px;border-radius:14px;border:none;
  background:var(--surface-2);color:var(--muted);font-size:1.05rem;font-weight:500;cursor:pointer;
}
.p-btn.active{background:var(--primary);color:var(--on-primary)}

.names{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:160px;overflow-y:auto}
.names input{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid #3F4947;
  background:var(--surface-2);color:var(--on);font-size:.9rem;outline:none;
}
.names input:focus{border-color:var(--primary)}
.start-btn{
  width:100%;padding:14px;border:none;border-radius:100px;
  background:var(--primary);color:var(--on-primary);
  font-size:1rem;font-weight:500;cursor:pointer;
}

/* GAME */
#game{display:none;width:100%;max-width:480px;flex:1;flex-direction:column;gap:10px}

.top{display:flex;gap:8px;align-items:center}
.turn{
  flex:1;background:var(--surface-2);padding:10px 14px;border-radius:14px;
  font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.timer{background:var(--surface-2);padding:10px 12px;border-radius:14px;font-size:.85rem;font-weight:500;color:var(--gold)}
.reset{background:var(--surface-2);border:none;color:var(--muted);padding:10px 12px;border-radius:14px;font-size:.8rem;cursor:pointer}

.board-wrap{
  width:100%;aspect-ratio:1;max-width:100%;margin:0 auto;
  background:var(--surface);border-radius:20px;padding:8px;
  border:1px solid #3F4947; flex-shrink:0;
}
.board{
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);
  width:100%;height:100%;gap:2px;border-radius:14px;overflow:hidden;background:#0A0E0D;
}
.cell{
  position:relative;background:#161B1A;
  display:flex;align-items:flex-start;justify-content:flex-start;
  font-size:.5rem;font-weight:500;color:#6B7573;padding:2px;border-radius:3px;
}
.cell.light{background:#1E2524}
.cell.snake-start{background:#B71C1C}
.cell.ladder-start{background:#1B5E20}
.cell.end{background:#F57F17;color:#000}
.cell.pulse{animation:pulse .3s ease}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 8px var(--primary)}}
.hint{position:absolute;font-size:.58rem;bottom:1px;right:1px;opacity:.9}

.token{
  position:absolute;width:32%;height:32%;border-radius:50%;
  border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5);
  z-index:10;display:flex;align-items:center;justify-content:center;
  font-size:.6rem;font-weight:700;color:#fff;
  transition:all .25s cubic-bezier(.2,0,0,1);
}
.token.bounce{animation:bounce .35s ease}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}

.ctrl{
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:var(--surface);border-radius:20px;padding:12px 16px;
  border:1px solid #3F4947;
}
.dice{
  width:68px;height:68px;background:#fff;border-radius:16px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:9px;box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:pointer;user-select:none;flex-shrink:0;
}
.dice.holding{animation:shake .09s linear infinite;box-shadow:0 0 18px var(--primary)}
@keyframes shake{
  0%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(-3px,2px) rotate(-6deg)}
  50%{transform:translate(3px,-2px) rotate(5deg)}
  75%{transform:translate(-2px,-2px) rotate(-3deg)}
  100%{transform:translate(0,0)}
}
.dot{width:11px;height:11px;background:#212121;border-radius:50%;margin:auto}
.dot.hide{visibility:hidden}

.players{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:260px}
.chip{
  display:flex;align-items:center;gap:6px;
  background:var(--surface-2);padding:6px 11px;border-radius:18px;
  font-size:.8rem;font-weight:500;white-space:nowrap;
}
.chip.active{outline:2px solid var(--primary)}
.chip .d{width:12px;height:12px;border-radius:50%;border:2px solid #fff;flex-shrink:0}

.hold-hint{font-size:.72rem;color:var(--muted);text-align:center}

/* END */
.overlay{
  position:fixed;inset:0;background:rgba(9,10,15,.9);
  display:none;align-items:center;justify-content:center;z-index:50;
}
.overlay.show{display:flex}
.modal{
  background:var(--surface);padding:24px;border-radius:28px;
  width:90%;max-width:320px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  border:1px solid #3F4947;text-align:center;
}
.modal h2{font-size:1.3rem;font-weight:500;color:var(--primary);margin-bottom:6px}
.modal .msg{font-size:.9rem;color:var(--muted);margin-bottom:14px}
.rank{background:var(--surface-2);border-radius:14px;padding:10px;margin-bottom:16px;text-align:left}
.rank-item{display:flex;justify-content:space-between;padding:6px 4px;font-size:.85rem;border-bottom:1px solid #3F4947}
.rank-item:last-child{border-bottom:none}
.modal button{
  width:100%;padding:14px;border:none;border-radius:100px;
  background:var(--primary);color:var(--on-primary);font-size:1rem;font-weight:500;cursor:pointer;
}

.confetti{position:fixed;width:8px;height:8px;top:-10px;z-index:60;animation:cfall linear forwards;border-radius:2px}
@keyframes cfall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
  <div class="sky" id="sky"></div>

  <h1 style="padding-top: 10%;">Ular Tangga Kehidupan</h1>
  <p class="sub" style="padding-bottom: 10%;">(Permainan dan Senda Gurau)-</p>

  <div id="game">

    <div class="board-wrap"><div class="board" id="board"></div></div>
	<div class="top">	
      <div class="turn" id="turnInfo">Giliran: —</div>
      <div class="timer" id="timer">00:00</div>
      <button class="reset" id="resetBtn">🔴</button>
    </div>
    <div class="ctrl">
      <div class="dice" id="dice">
        <div class="dot" data-pos="1"></div><div class="dot" data-pos="2"></div><div class="dot" data-pos="3"></div>
        <div class="dot" data-pos="4"></div><div class="dot" data-pos="5"></div><div class="dot" data-pos="6"></div>
        <div class="dot" data-pos="7"></div><div class="dot" data-pos="8"></div><div class="dot" data-pos="9"></div>
      </div>
      <div class="players" id="playersBar"></div>
    </div>

    <div class="hold-hint" id="holdHint">Hold to Roll</div>
  </div>

  <div id="setup">
    <div class="card">
      <h2>Ular Tangga Kehidupan</h2>
      <p class="slogan">Permainan dan Senda Gurau</p>
      <div class="sec" style="text-align: center;">PLAYERS</div>
      <div class="p-select">
        <button class="p-btn active" data-n="1">1</button>
        <button class="p-btn" data-n="2">2</button>
        <button class="p-btn" data-n="3">3</button>
        <button class="p-btn" data-n="4">4</button>
        <button class="p-btn" data-n="5">5</button>
        <button class="p-btn" data-n="6">6</button>
      </div>
      <div class="sec" style="text-align: center;">Name(customize)</div>
      <div class="names" id="nameInputs"></div>
      <button class="start-btn" id="startBtn">START</button>
    </div>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2 id="winTitle">🎉 Win!</h2>
      <p class="msg" id="winMsg"></p>
      <div class="rank" id="rankList"></div>
      <button id="playAgain">Play Againt</button>
    </div>
  </div>

<script>
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const SNAKES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const COLORS=['#2196F3','#FF9800','#9C27B0','#E91E63','#4CAF50','#00BCD4'];
const DEFAULTS=['Biru','Oranye','Ungu','Pink','Hijau','Cyan'];

let numPlayers=1, players=[], current=0, positions=[], isMoving=false, gameOver=false;
let audioCtx=null, gameStart=0, timerInt=null, holding=false, holdInt=null;

// Night sky
(function createSky(){
  const sky=document.getElementById('sky');
  for(let i=0;i<60;i++){
    const s=document.createElement('div'); s.className='star';
    s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
    s.style.width=s.style.height=(1+Math.random()*2)+'px';
    s.style.setProperty('--d',(2+Math.random()*4)+'s');
    sky.appendChild(s);
  }
  setInterval(()=>{
    const f=document.createElement('div'); f.className='falling';
    f.style.left=Math.random()*100+'%'; f.style.top='-5%';
    f.style.animationDuration=(1.5+Math.random()*2)+'s';
    sky.appendChild(f);
    setTimeout(()=>f.remove(),4000);
  },800);
})();

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,type='sine',vol=.16,to=null){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.type=type;
  o.frequency.setValueAtTime(f,audioCtx.currentTime);
  if(to)o.frequency.linearRampToValueAtTime(to,audioCtx.currentTime+d);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.start();o.stop(audioCtx.currentTime+d);
}
function welcomeMelody(){
  const notes=[[262,.2],[330,.2],[392,.2],[523,.35],[392,.15],[523,.4]];
  notes.forEach(([f,d],i)=>setTimeout(()=>tone(f,d,'sine',.14),i*220));
}
function sfxHold(){tone(90+Math.random()*70,.035,'sawtooth',.08)}
function sfxStep(){tone(290,.05,'triangle',.12)}
function sfxLadder(){tone(360,.32,'sine',.18,720);setTimeout(()=>tone(500,.15,'sine',.12),90)}
function sfxSnake(){tone(250,.38,'sawtooth',.14,95)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.14,'sine',.15),i*70))}

function renderNameInputs(){
  const box=document.getElementById('nameInputs');
  box.innerHTML='';
  for(let i=0;i<numPlayers;i++){
    const inp=document.createElement('input');
    inp.type='text'; inp.placeholder=`Pemain ${i+1}`; inp.maxLength=12;
    inp.dataset.i=i; inp.value=DEFAULTS[i]||`Pemain ${i+1}`;
    box.appendChild(inp);
  }
}

document.querySelectorAll('.p-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.p-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); numPlayers=+b.dataset.n; renderNameInputs();
});
renderNameInputs();

document.getElementById('startBtn').onclick=()=>{
  initAudio(); welcomeMelody();
  setTimeout(startGame, 900);
};
document.getElementById('resetBtn').onclick=()=>location.reload();
document.getElementById('playAgain').onclick=()=>location.reload();

const diceEl=document.getElementById('dice');
diceEl.addEventListener('pointerdown',e=>{
  if(isMoving||gameOver||holding||document.getElementById('setup').style.display!=='none')return;
  e.preventDefault(); holding=true; diceEl.classList.add('holding');
  document.getElementById('holdHint').textContent='Lepas...';
  holdInt=setInterval(()=>{setDice(1+Math.floor(Math.random()*6));sfxHold()},60);
});
const stopHold=()=>{
  if(!holding)return; holding=false; diceEl.classList.remove('holding');
  clearInterval(holdInt); document.getElementById('holdHint').textContent='Tahan dadu → Lepas untuk lempar';
  const val=1+Math.floor(Math.random()*6); setDice(val); doMove(val);
};
diceEl.addEventListener('pointerup',stopHold);
diceEl.addEventListener('pointerleave',stopHold);
diceEl.addEventListener('pointercancel',stopHold);

buildBoard(); setDice(1);

function startGame(){
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='flex';
  const inputs=[...document.querySelectorAll('#nameInputs input')];
  players=[]; positions=[];
  for(let i=0;i<numPlayers;i++){
    const name=(inputs[i]?.value.trim())||DEFAULTS[i]||`Pemain ${i+1}`;
    players.push({id:i,name,color:COLORS[i]});
    positions.push(0);
  }
  current=0; gameOver=false; isMoving=false; gameStart=Date.now();
  timerInt=setInterval(updateTimer,1000); updateTimer();
  buildBoard(); updateUI(); setDice(1);
}

function updateTimer(){
  const s=Math.floor((Date.now()-gameStart)/1000);
  document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function buildBoard(){
  const board=document.getElementById('board'); board.innerHTML='';
  for(let r=9;r>=0;r--)for(let c=0;c<10;c++){
    const num=r%2===0?r*10+c+1:r*10+(9-c)+1;
    const cell=document.createElement('div'); cell.className='cell'; cell.dataset.num=num;
    if((r+c)%2===0)cell.classList.add('light');
    if(num===100)cell.classList.add('end');
    if(SNAKES[num])cell.classList.add('snake-start');
    if(LADDERS[num])cell.classList.add('ladder-start');
    cell.innerHTML=`<span>${num}</span>`;
    if(SNAKES[num])cell.innerHTML+=`<span class="hint">🐍${SNAKES[num]}</span>`;
    else if(LADDERS[num])cell.innerHTML+=`<span class="hint">🪜${LADDERS[num]}</span>`;
    const td=document.createElement('div'); td.className='tokens'; td.style.cssText='position:absolute;inset:0';
    cell.appendChild(td); board.appendChild(cell);
  }
  updateTokens();
}

function getCell(n){return document.querySelector(`.cell[data-num="${n}"]`)}
function updateTokens(){
  document.querySelectorAll('.token').forEach(t=>t.remove());
  positions.forEach((pos,i)=>{
    if(pos===0)return;
    const cell=getCell(pos); if(!cell)return;
    const td=cell.querySelector('.tokens');
    const t=document.createElement('div');
    t.className=`token p${i+1}`; t.style.background=COLORS[i]; t.textContent=i+1;
    const cnt=td.children.length;
    if(cnt===0){t.style.top='8%';t.style.left='8%'}
    else if(cnt===1){t.style.top='8%';t.style.right='8%';t.style.left='auto'}
    else if(cnt===2){t.style.bottom='8%';t.style.left='8%';t.style.top='auto'}
    else if(cnt===3){t.style.bottom='8%';t.style.right='8%';t.style.top='auto';t.style.left='auto'}
    else if(cnt===4){t.style.top='30%';t.style.left='30%'}
    else{t.style.top='30%';t.style.right='30%';t.style.left='auto'}
    td.appendChild(t);
  });
}

function setDice(n){
  const dots=document.querySelectorAll('.dice .dot');
  const pat={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  dots.forEach((d,i)=>d.classList.toggle('hide',!pat[n].includes(i+1)));
}

function updateUI(){
  if(!players.length)return;
  const p=players[current];
  document.getElementById('turnInfo').textContent=`Giliran: ${p.name}`;
  document.getElementById('turnInfo').style.borderLeft=`4px solid ${p.color}`;
  document.getElementById('playersBar').innerHTML=players.map((pl,i)=>`
    <div class="chip ${i===current?'active':''}">
      <div class="d" style="background:${pl.color}"></div>${pl.name} ${positions[i]}
    </div>`).join('');
}

async function doMove(roll){
  if(isMoving||gameOver)return; isMoving=true;
  let from=positions[current], to=from+roll;
  if(to>100)to=100-(to-100);

  for(let step=from+1;step<=to;step++){
    positions[current]=step; updateTokens();
    const cell=getCell(step); if(cell){cell.classList.add('pulse');setTimeout(()=>cell.classList.remove('pulse'),280)}
    sfxStep(); await sleep(130);
  }

  let final=positions[current];
  if(LADDERS[final]){
    await sleep(140); sfxLadder();
    positions[current]=LADDERS[final]; updateTokens();
    const tok=document.querySelector(`.token.p${current+1}`);
    if(tok){tok.classList.add('bounce');setTimeout(()=>tok.classList.remove('bounce'),350)}
  }else if(SNAKES[final]){
    await sleep(140); sfxSnake();
    positions[current]=SNAKES[final]; updateTokens();
    const tok=document.querySelector(`.token.p${current+1}`);
    if(tok){tok.classList.add('bounce');setTimeout(()=>tok.classList.remove('bounce'),350)}
  }

  if(positions[current]===100){
    gameOver=true; clearInterval(timerInt); sfxWin();
    showEnd(); isMoving=false; updateUI(); return;
  }
  current=(current+1)%numPlayers; isMoving=false; updateUI();
}

function showEnd(){
  const p=players[current];
  document.getElementById('winTitle').textContent=`🎉 ${p.name} Menang!`;
  document.getElementById('winMsg').textContent=`Posisi 100 • ${document.getElementById('timer').textContent}`;
  const ranking=players.map((pl,i)=>({name:pl.name,color:pl.color,pos:positions[i]})).sort((a,b)=>b.pos-a.pos);
  document.getElementById('rankList').innerHTML=ranking.map((r,i)=>`
    <div class="rank-item">
      <span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'} <b style="color:${r.color}">${r.name}</b></span>
      <span>Pos ${r.pos}</span>
    </div>`).join('');
  document.getElementById('winOverlay').classList.add('show');
  confetti();
}

function confetti(){
  const cols=['#2196F3','#FF9800','#9C27B0','#E91E63','#4CAF50','#00BCD4','#FFC107'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div'); el.className='confetti';
    el.style.left=Math.random()*100+'vw'; el.style.background=cols[i%cols.length];
    el.style.width=(5+Math.random()*7)+'px'; el.style.height=(5+Math.random()*7)+'px';
    el.style.animationDuration=(1.5+Math.random()*2)+'s'; el.style.animationDelay=Math.random()*.45+'s';
    document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
