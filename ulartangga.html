<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ular Tangga</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #22d3ee;
    --text: #f1f5f9;
    --snake: #ef4444;
    --ladder: #22c55e;
    --p1: #3b82f6;
    --p2: #f59e0b;
    --p3: #a855f7;
    --p4: #ec4899;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #22d3ee, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle { font-size: 0.8rem; opacity: 0.7; margin-bottom: 16px; }
  
  /* Setup */
  #setup {
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .setup-title { font-size: 1.2rem; margin-bottom: 16px; text-align: center; }
  .player-select {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .p-btn {
    width: 48px; height: 48px;
    border-radius: 12px;
    border: 2px solid transparent;
    background: #334155;
    color: white;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .p-btn.active { border-color: var(--accent); background: #0e7490; transform: scale(1.08); }
  .start-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #06b6d4, #8b5cf6);
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .start-btn:active { transform: scale(0.97); }
  
  /* Game */
  #game { display: none; width: 100%; max-width: 480px; flex-direction: column; align-items: center; }
  .top-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .turn-info {
    background: var(--card);
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .reset-btn {
    background: #334155;
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  
  /* Board */
  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    max-width: 440px;
    background: #1e293b;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5), inset 0 0 0 3px #334155;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    width: 100%;
    height: 100%;
    gap: 2px;
    border-radius: 10px;
    overflow: hidden;
  }
  .cell {
    position: relative;
    background: #0f172a;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    font-size: 0.55rem;
    font-weight: 600;
    color: #64748b;
    padding: 2px 3px;
    border-radius: 3px;
  }
  .cell.light { background: #1e293b; }
  .cell.snake-start { background: linear-gradient(135deg, #7f1d1d, #450a0a); }
  .cell.ladder-start { background: linear-gradient(135deg, #14532d, #052e16); }
  .cell.end { background: linear-gradient(135deg, #854d0e, #422006); }
  
  .token {
    position: absolute;
    width: 22%;
    height: 22%;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.6rem;
    font-weight: 800;
    color: white;
  }
  .token.p1 { background: var(--p1); top: 8%; left: 8%; }
  .token.p2 { background: var(--p2); top: 8%; right: 8%; left: auto; }
  .token.p3 { background: var(--p3); bottom: 8%; left: 8%; top: auto; }
  .token.p4 { background: var(--p4); bottom: 8%; right: 8%; top: auto; left: auto; }
  
  /* Dice */
  .controls {
    width: 100%;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .dice-area {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .dice {
    width: 64px;
    height: 64px;
    background: white;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 8px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    position: relative;
  }
  .dice.rolling { animation: shake 0.5s ease infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-12deg) scale(1.05); }
    75% { transform: rotate(12deg) scale(1.05); }
  }
  .dot {
    width: 10px; height: 10px;
    background: #0f172a;
    border-radius: 50%;
    margin: auto;
  }
  .dot.hide { visibility: hidden; }
  
  .roll-btn {
    padding: 14px 32px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(90deg, #22d3ee, #6366f1);
    color: white;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(34,211,238,0.3);
    transition: all 0.2s;
  }
  .roll-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }
  .roll-btn:active:not(:disabled) { transform: scale(0.96); }
  
  .players-bar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 8px;
  }
  .player-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
  }
  .player-chip .dot-p {
    width: 12px; height: 12px;
    border-radius: 50%;
  }
  .player-chip.active {
    outline: 2px solid var(--accent);
  }
  
  /* Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card);
    padding: 28px;
    border-radius: 24px;
    text-align: center;
    max-width: 300px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .modal h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .modal p { opacity: 0.8; margin-bottom: 20px; }
  .modal button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #22d3ee, #8b5cf6);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  
  /* Snakes & Ladders visual hints */
  .hint {
    position: absolute;
    font-size: 0.7rem;
    bottom: 2px;
    right: 3px;
    opacity: 0.9;
  }
  
  /* Confetti */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    z-index: 200;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
  <h1>Ular Tangga</h1>
  <p class="subtitle">🐍 Mainkan & nikmati! 🪜</p>
  
  <div id="setup">
    <div class="setup-title">Pilih Jumlah Pemain</div>
    <div class="player-select">
      <button class="p-btn active" data-n="2">2</button>
      <button class="p-btn" data-n="3">3</button>
      <button class="p-btn" data-n="4">4</button>
    </div>
    <button class="start-btn" id="startBtn">Mulai Main</button>
  </div>
  
  <div id="game">
    <div class="top-bar">
      <div class="turn-info" id="turnInfo">Giliran: P1</div>
      <button class="reset-btn" id="resetBtn">Reset</button>
    </div>
    
    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>
    
    <div class="controls">
      <div class="dice-area">
        <div class="dice" id="dice">
          <div class="dot" data-pos="1"></div>
          <div class="dot" data-pos="2"></div>
          <div class="dot" data-pos="3"></div>
          <div class="dot" data-pos="4"></div>
          <div class="dot" data-pos="5"></div>
          <div class="dot" data-pos="6"></div>
          <div class="dot" data-pos="7"></div>
          <div class="dot" data-pos="8"></div>
          <div class="dot" data-pos="9"></div>
        </div>
        <button class="roll-btn" id="rollBtn">🎲 Lempar</button>
      </div>
      <div class="players-bar" id="playersBar"></div>
    </div>
  </div>
  
  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2 id="winTitle">🎉 Menang!</h2>
      <p id="winMsg">Pemain 1 juara!</p>
      <button id="playAgain">Main Lagi</button>
    </div>
  </div>

<script>
const LADDERS = {
  1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44,
  51: 67, 71: 91, 80: 100
};
const SNAKES = {
  16: 6, 47: 26, 49: 11, 56: 53, 62: 19,
  64: 60, 87: 24, 93: 73, 95: 75, 98: 78
};

const COLORS = ['#3b82f6', '#f59e0b', '#a855f7', '#ec4899'];
const NAMES = ['Biru', 'Oranye', 'Ungu', 'Pink'];

let numPlayers = 2;
let players = [];
let current = 0;
let positions = [];
let isMoving = false;
let gameOver = false;

// Setup
document.querySelectorAll('.p-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    numPlayers = +btn.dataset.n;
  });
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('resetBtn').addEventListener('click', () => location.reload());
document.getElementById('playAgain').addEventListener('click', () => location.reload());
document.getElementById('rollBtn').addEventListener('click', rollDice);

function startGame() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  
  players = [];
  positions = [];
  for (let i = 0; i < numPlayers; i++) {
    players.push({ id: i, name: NAMES[i], color: COLORS[i] });
    positions.push(0);
  }
  current = 0;
  gameOver = false;
  isMoving = false;
  
  buildBoard();
  updateUI();
  setDice(1);
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  
  // Build cells from top (100) to bottom (1)
  for (let row = 9; row >= 0; row--) {
    for (let col = 0; col < 10; col++) {
      let num;
      if (row % 2 === 0) {
        // even row from bottom: left to right
        num = row * 10 + col + 1;
      } else {
        // odd: right to left
        num = row * 10 + (9 - col) + 1;
      }
      
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.num = num;
      if ((row + col) % 2 === 0) cell.classList.add('light');
      
      if (num === 100) cell.classList.add('end');
      if (SNAKES[num]) cell.classList.add('snake-start');
      if (LADDERS[num]) cell.classList.add('ladder-start');
      
      cell.innerHTML = `<span>${num}</span>`;
      
      // hint
      if (SNAKES[num]) {
        cell.innerHTML += `<span class="hint">🐍${SNAKES[num]}</span>`;
      } else if (LADDERS[num]) {
        cell.innerHTML += `<span class="hint">🪜${LADDERS[num]}</span>`;
      }
      
      // tokens container
      const tokensDiv = document.createElement('div');
      tokensDiv.className = 'tokens';
      tokensDiv.style.cssText = 'position:absolute;inset:0;';
      cell.appendChild(tokensDiv);
      
      board.appendChild(cell);
    }
  }
  
  // place tokens initially off board (pos 0)
  updateTokens();
}

function getCell(num) {
  return document.querySelector(`.cell[data-num="${num}"]`);
}

function updateTokens() {
  // clear all tokens
  document.querySelectorAll('.token').forEach(t => t.remove());
  
  positions.forEach((pos, i) => {
    if (pos === 0) return; // still at start
    const cell = getCell(pos);
    if (!cell) return;
    const tokensDiv = cell.querySelector('.tokens');
    const token = document.createElement('div');
    token.className = `token p${i+1}`;
    token.style.background = COLORS[i];
    token.textContent = i + 1;
    
    // offset if multiple
    const count = tokensDiv.children.length;
    if (count === 0) { token.style.top = '15%'; token.style.left = '15%'; }
    else if (count === 1) { token.style.top = '15%'; token.style.right = '15%'; token.style.left = 'auto'; }
    else if (count === 2) { token.style.bottom = '15%'; token.style.left = '15%'; token.style.top = 'auto'; }
    else { token.style.bottom = '15%'; token.style.right = '15%'; token.style.top = 'auto'; token.style.left = 'auto'; }
    
    tokensDiv.appendChild(token);
  });
}

function setDice(n) {
  const dots = document.querySelectorAll('.dice .dot');
  const patterns = {
    1: [5],
    2: [1,9],
    3: [1,5,9],
    4: [1,3,7,9],
    5: [1,3,5,7,9],
    6: [1,3,4,6,7,9]
  };
  dots.forEach((d, i) => {
    d.classList.toggle('hide', !patterns[n].includes(i + 1));
  });
}

function updateUI() {
  const p = players[current];
  document.getElementById('turnInfo').textContent = `Giliran: ${p.name}`;
  document.getElementById('turnInfo').style.borderLeft = `4px solid ${p.color}`;
  
  const bar = document.getElementById('playersBar');
  bar.innerHTML = players.map((pl, i) => `
    <div class="player-chip ${i === current ? 'active' : ''}">
      <div class="dot-p" style="background:${pl.color}"></div>
      ${pl.name}: ${positions[i]}
    </div>
  `).join('');
  
  document.getElementById('rollBtn').disabled = isMoving || gameOver;
}

async function rollDice() {
  if (isMoving || gameOver) return;
  isMoving = true;
  document.getElementById('rollBtn').disabled = true;
  
  const diceEl = document.getElementById('dice');
  diceEl.classList.add('rolling');
  
  // animate roll
  for (let i = 0; i < 8; i++) {
    setDice(Math.floor(Math.random() * 6) + 1);
    await sleep(80);
  }
  diceEl.classList.remove('rolling');
  
  const roll = Math.floor(Math.random() * 6) + 1;
  setDice(roll);
  
  await sleep(300);
  
  // move
  const from = positions[current];
  let to = from + roll;
  
  if (to > 100) {
    // bounce back
    to = 100 - (to - 100);
  }
  
  // step by step animation
  for (let p = from + 1; p <= to; p++) {
    positions[current] = p;
    updateTokens();
    await sleep(180);
  }
  
  // check snake / ladder
  let final = positions[current];
  if (LADDERS[final]) {
    await sleep(200);
    positions[current] = LADDERS[final];
    updateTokens();
    // little bounce effect
    const t = document.querySelector(`.token.p${current+1}`);
    if (t) {
      t.style.transform = 'scale(1.3)';
      await sleep(200);
      t.style.transform = '';
    }
  } else if (SNAKES[final]) {
    await sleep(200);
    positions[current] = SNAKES[final];
    updateTokens();
    const t = document.querySelector(`.token.p${current+1}`);
    if (t) {
      t.style.transform = 'scale(0.8)';
      await sleep(200);
      t.style.transform = '';
    }
  }
  
  // check win
  if (positions[current] === 100) {
    gameOver = true;
    showWin();
    isMoving = false;
    updateUI();
    return;
  }
  
  // next player
  current = (current + 1) % numPlayers;
  isMoving = false;
  updateUI();
}

function showWin() {
  const p = players[current];
  document.getElementById('winTitle').textContent = `🎉 ${p.name} Menang!`;
  document.getElementById('winMsg').textContent = `Selamat! ${p.name} mencapai 100 duluan.`;
  document.getElementById('winOverlay').classList.add('show');
  confetti();
}

function confetti() {
  const colors = ['#22d3ee', '#a855f7', '#f59e0b', '#ec4899', '#22c55e'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (Math.random() * 2 + 2) + 's';
    el.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}
</script>
</body>
</html>
