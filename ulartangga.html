<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ular Tangga</title>
<style>
:root{--p1:#3b82f6;--p2:#f59e0b;--p3:#a855f7;--p4:#ec4899;--accent:#22d3ee;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 30% 15%,#1e1b4b,#0c1222 55%,#0a0f1a);color:#f1f5f9;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:6px;overflow-x:hidden}
h1{font-size:1.35rem;font-weight:900;background:linear-gradient(90deg,#22d3ee,#a855f7,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0 1px}
.sub{font-size:.68rem;opacity:.55;margin-bottom:6px}

/* POPUP WELCOME */
#setup{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
}
.setup-card{
  background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:20px;padding:24px 22px;
  width:90%;max-width:300px;box-shadow:0 25px 50px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.setup-t{text-align:center;font-weight:700;margin-bottom:14px;font-size:1.05rem}
.p-select{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.p-btn{width:46px;height:46px;border-radius:12px;border:2px solid transparent;background:#334155;color:#fff;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 #1e293b}
.p-btn.active{border-color:var(--accent);background:linear-gradient(135deg,#0e7490,#0891b2);transform:translateY(-2px);box-shadow:0 5px 0 #0e7490}
.start-btn{width:100%;padding:13px;border:none;border-radius:14px;background:linear-gradient(90deg,#06b6d4,#8b5cf6);color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer}

/* GAME */
#game{display:flex;width:100%;max-width:460px;flex-direction:column;gap:6px}
.board-wrap{position:relative;width:100%;aspect-ratio:1;max-width:380px;margin:0 auto;background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:14px;padding:7px;box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 0 2px #334155}
.board{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%;gap:2px;border-radius:9px;overflow:hidden;background:#0f172a}
.cell{position:relative;background:#1e293b;display:flex;align-items:flex-start;justify-content:flex-start;font-size:.46rem;font-weight:700;color:#64748b;padding:1px 2px;border-radius:3px}
.cell.light{background:#243044}
.cell.snake-start{background:linear-gradient(145deg,#7f1d1d,#450a0a);box-shadow:inset 0 0 5px rgba(239,68,68,.3)}
.cell.ladder-start{background:linear-gradient(145deg,#14532d,#052e16);box-shadow:inset 0 0 5px rgba(34,197,94,.3)}
.cell.end{background:linear-gradient(145deg,#854d0e,#422006);box-shadow:inset 0 0 6px rgba(251,191,36,.35)}
.cell.pulse{animation:cellPulse .3s ease}
@keyframes cellPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 8px var(--accent)}}
.hint{position:absolute;font-size:.55rem;bottom:0;right:1px;opacity:.8}

.token{position:absolute;width:30%;height:30%;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.5);z-index:10;display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:900;color:#fff;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.token::after{content:'';position:absolute;inset:2px;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.35),transparent);pointer-events:none}
.token.bounce{animation:tokBounce .35s ease}
@keyframes tokBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}}

/* DICE + PLAYERS SIDE BY SIDE */
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;padding:2px 0}
.dice{width:58px;height:58px;background:linear-gradient(145deg,#fff,#e2e8f0);border-radius:11px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;box-shadow:0 5px 14px rgba(0,0,0,.35),inset 0 -2px 4px rgba(0,0,0,.1);border:2px solid #cbd5e1;cursor:pointer;user-select:none;flex-shrink:0}
.dice.holding{animation:shake .09s linear infinite;box-shadow:0 0 16px rgba(34,211,238,.45)}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-2px,2px) rotate(-6deg)}50%{transform:translate(2px,-1px) rotate(4deg)}75%{transform:translate(-1px,-2px) rotate(-3deg)}100%{transform:translate(0,0)}}
.dot{width:9px;height:9px;background:#0f172a;border-radius:50%;margin:auto}
.dot.hide{visibility:hidden}
.players{display:flex;flex-direction:column;gap:4px;min-width:0}
.chip{display:flex;align-items:center;gap:5px;background:linear-gradient(145deg,#1e293b,#0f172a);padding:4px 9px;border-radius:14px;font-size:.72rem;font-weight:600;border:1px solid rgba(255,255,255,.04);white-space:nowrap}
.chip.active{outline:2px solid var(--accent);box-shadow:0 0 8px rgba(34,211,238,.2)}
.chip .d{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;flex-shrink:0}
.hold-hint{font-size:.62rem;opacity:.5;text-align:center;width:100%}

/* TOP above LOG */
.top{display:flex;justify-content:space-between;align-items:center;gap:5px}
.turn{background:linear-gradient(135deg,#1e293b,#0f172a);padding:6px 10px;border-radius:10px;font-weight:700;font-size:.82rem;border:1px solid rgba(255,255,255,.04);flex:1}
.timer{background:#0f172a;padding:6px 8px;border-radius:8px;font-size:.72rem;font-weight:600;color:#fbbf24;white-space:nowrap}
.reset{background:#334155;border:none;color:#94a3b8;padding:6px 9px;border-radius:8px;font-size:.7rem;cursor:pointer}

/* COMPACT LOG */
.log-wrap{width:100%;background:linear-gradient(145deg,#1e293b,#0f172a);border-radius:10px;padding:6px 8px;border:1px solid rgba(255,255,255,.04);max-height:96px;overflow:hidden}
.log-title{font-size:.65rem;font-weight:700;opacity:.6;margin-bottom:3px}
#log{height:72px;overflow-y:auto;font-size:.65rem;line-height:1.35;scrollbar-width:thin}
.log-item{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.025);display:flex;gap:5px}
.log-item .t{opacity:.45;font-size:.58rem;min-width:48px;flex-shrink:0}
.log-item.good{color:var(--good)}
.log-item.bad{color:var(--bad)}
.log-item.dice{color:var(--accent)}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:40;backdrop-filter:blur(5px)}
.overlay.show{display:flex}
.modal{background:linear-gradient(145deg,#1e293b,#0f172a);padding:18px;border-radius:18px;width:92%;max-width:330px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 45px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.06)}
.modal h2{font-size:1.25rem;margin-bottom:3px;text-align:center}
.modal .msg{text-align:center;opacity:.75;font-size:.85rem;margin-bottom:8px}
.rank{background:#0f172a;border-radius:9px;padding:7px;margin-bottom:8px}
.rank-item{display:flex;justify-content:space-between;padding:4px 3px;font-size:.8rem;border-bottom:1px solid #1e293b}
.rank-item:last-child{border-bottom:none}
.full-log{background:#0f172a;border-radius:9px;padding:7px;max-height:160px;overflow-y:auto;font-size:.65rem;line-height:1.35;margin-bottom:10px}
.full-log .li{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.modal button{width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);color:#fff;font-weight:800;font-size:.9rem;cursor:pointer}

.confetti{position:fixed;width:7px;height:7px;top:-8px;z-index:50;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<h1>Ular Tangga</h1>
<p class="sub">Langkah hidup • Keberuntungan & risiko</p>

<!-- Board always visible as background -->
<div id="game" style="display:flex">
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="ctrl">
    <div class="dice" id="dice">
      <div class="dot" data-pos="1"></div><div class="dot" data-pos="2"></div><div class="dot" data-pos="3"></div>
      <div class="dot" data-pos="4"></div><div class="dot" data-pos="5"></div><div class="dot" data-pos="6"></div>
      <div class="dot" data-pos="7"></div><div class="dot" data-pos="8"></div><div class="dot" data-pos="9"></div>
    </div>
    <div class="players" id="playersBar"></div>
  </div>
  <div class="hold-hint" id="holdHint">Tahan dadu → Lepas untuk lempar</div>
  <div class="top">
    <div class="turn" id="turnInfo">Giliran: —</div>
    <div class="timer" id="timer">00:00</div>
    <button class="reset" id="resetBtn">Reset</button>
  </div>
  <div class="log-wrap">
    <div class="log-title">📜 Log</div>
    <div id="log"></div>
  </div>
</div>

<!-- Popup setup over board -->
<div id="setup">
  <div class="setup-card">
    <div class="setup-t">Pilih Pemain</div>
    <div class="p-select">
      <button class="p-btn active" data-n="2">2</button>
      <button class="p-btn" data-n="3">3</button>
      <button class="p-btn" data-n="4">4</button>
    </div>
    <button class="start-btn" id="startBtn">Mulai Main</button>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="modal">
    <h2 id="winTitle">🎉 Menang!</h2>
    <p class="msg" id="winMsg"></p>
    <div class="rank" id="rankList"></div>
    <div class="full-log" id="fullLog"></div>
    <button id="playAgain">Main Lagi</button>
  </div>
</div>

<script>
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const SNAKES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const COLORS=['#3b82f6','#f59e0b','#a855f7','#ec4899'];
const NAMES=['Biru','Oranye','Ungu','Pink'];

let numPlayers=2,players=[],current=0,positions=[],isMoving=false,gameOver=false;
let audioCtx=null,gameStart=0,timerInt=null,gameLog=[],holding=false,holdInt=null;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(f,d,type='sine',vol=.18,to=null){
  if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.type=type;
  o.frequency.setValueAtTime(f,audioCtx.currentTime);
  if(to)o.frequency.linearRampToValueAtTime(to,audioCtx.currentTime+d);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.start();o.stop(audioCtx.currentTime+d);
}
function sfxHold(){tone(90+Math.random()*80,.04,'sawtooth',.09)}
function sfxStep(){tone(300,.055,'triangle',.13)}
function sfxLadder(){tone(380,.38,'sine',.2,780);setTimeout(()=>tone(520,.18,'sine',.14),110)}
function sfxSnake(){tone(260,.42,'sawtooth',.15,100)}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16,'sine',.17),i*75))}

document.querySelectorAll('.p-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.p-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');numPlayers=+b.dataset.n;
});
document.getElementById('startBtn').onclick=()=>{initAudio();startGame()};
document.getElementById('resetBtn').onclick=()=>location.reload();
document.getElementById('playAgain').onclick=()=>location.reload();

const diceEl=document.getElementById('dice');
diceEl.addEventListener('pointerdown',e=>{
  if(isMoving||gameOver||holding||document.getElementById('setup').style.display!=='none')return;
  e.preventDefault();holding=true;diceEl.classList.add('holding');
  document.getElementById('holdHint').textContent='Lepas untuk berhenti...';
  holdInt=setInterval(()=>{setDice(1+Math.floor(Math.random()*6));sfxHold()},65);
});
const stopHold=()=>{
  if(!holding)return;holding=false;diceEl.classList.remove('holding');
  clearInterval(holdInt);document.getElementById('holdHint').textContent='Tahan dadu → Lepas untuk lempar';
  const val=1+Math.floor(Math.random()*6);setDice(val);doMove(val);
};
diceEl.addEventListener('pointerup',stopHold);
diceEl.addEventListener('pointerleave',stopHold);
diceEl.addEventListener('pointercancel',stopHold);

// Pre-build board so it shows behind popup
buildBoard();
setDice(1);

function startGame(){
  document.getElementById('setup').style.display='none';
  players=[];positions=[];gameLog=[];
  for(let i=0;i<numPlayers;i++){players.push({id:i,name:NAMES[i],color:COLORS[i]});positions.push(0)}
  current=0;gameOver=false;isMoving=false;gameStart=Date.now();
  timerInt=setInterval(updateTimer,1000);updateTimer();
  buildBoard();updateUI();setDice(1);addLog('Game dimulai','info');
}

function updateTimer(){
  const s=Math.floor((Date.now()-gameStart)/1000);
  document.getElementById('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function buildBoard(){
  const board=document.getElementById('board');board.innerHTML='';
  for(let r=9;r>=0;r--)for(let c=0;c<10;c++){
    const num=r%2===0?r*10+c+1:r*10+(9-c)+1;
    const cell=document.createElement('div');cell.className='cell';cell.dataset.num=num;
    if((r+c)%2===0)cell.classList.add('light');
    if(num===100)cell.classList.add('end');
    if(SNAKES[num])cell.classList.add('snake-start');
    if(LADDERS[num])cell.classList.add('ladder-start');
    cell.innerHTML=`<span>${num}</span>`;
    if(SNAKES[num])cell.innerHTML+=`<span class="hint">🐍${SNAKES[num]}</span>`;
    else if(LADDERS[num])cell.innerHTML+=`<span class="hint">🪜${LADDERS[num]}</span>`;
    const td=document.createElement('div');td.className='tokens';td.style.cssText='position:absolute;inset:0';
    cell.appendChild(td);board.appendChild(cell);
  }
  updateTokens();
}

function getCell(n){return document.querySelector(`.cell[data-num="${n}"]`)}
function updateTokens(){
  document.querySelectorAll('.token').forEach(t=>t.remove());
  positions.forEach((pos,i)=>{
    if(pos===0)return;const cell=getCell(pos);if(!cell)return;
    const td=cell.querySelector('.tokens');const t=document.createElement('div');
    t.className=`token p${i+1}`;t.style.background=COLORS[i];t.textContent=i+1;
    const cnt=td.children.length;
    if(cnt===0){t.style.top='8%';t.style.left='8%'}
    else if(cnt===1){t.style.top='8%';t.style.right='8%';t.style.left='auto'}
    else if(cnt===2){t.style.bottom='8%';t.style.left='8%';t.style.top='auto'}
    else{t.style.bottom='8%';t.style.right='8%';t.style.top='auto';t.style.left='auto'}
    td.appendChild(t);
  });
}

function setDice(n){
  const dots=document.querySelectorAll('.dice .dot');
  const pat={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
  dots.forEach((d,i)=>d.classList.toggle('hide',!pat[n].includes(i+1)));
}

function updateUI(){
  if(!players.length)return;
  const p=players[current];
  document.getElementById('turnInfo').textContent=`Giliran: ${p.name}`;
  document.getElementById('turnInfo').style.borderLeft=`3px solid ${p.color}`;
  document.getElementById('playersBar').innerHTML=players.map((pl,i)=>`
    <div class="chip ${i===current?'active':''}"><div class="d" style="background:${pl.color}"></div>${pl.name} ${positions[i]}</div>`).join('');
}

function addLog(txt,type=''){
  const t=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  gameLog.push({t,txt,type});
  const el=document.getElementById('log');
  const item=document.createElement('div');item.className=`log-item ${type}`;
  item.innerHTML=`<span class="t">${t}</span><span>${txt}</span>`;
  el.appendChild(item);el.scrollTop=el.scrollHeight;
}

async function doMove(roll){
  if(isMoving||gameOver)return;isMoving=true;
  const p=players[current];
  addLog(`${p.name} 🎲 ${roll}`,'dice');
  
  let from=positions[current],to=from+roll;
  if(to>100)to=100-(to-100);
  
  for(let step=from+1;step<=to;step++){
    positions[current]=step;updateTokens();
    const cell=getCell(step);if(cell){cell.classList.add('pulse');setTimeout(()=>cell.classList.remove('pulse'),280)}
    sfxStep();await sleep(130);
  }
  
  let final=positions[current];
  if(LADDERS[final]){
    await sleep(140);sfxLadder();
    const dest=LADDERS[final];
    addLog(`🪜 ${p.name} ${final}→${dest}`,'good');
    positions[current]=dest;updateTokens();
    const tok=document.querySelector(`.token.p${current+1}`);
    if(tok){tok.classList.add('bounce');setTimeout(()=>tok.classList.remove('bounce'),350)}
  }else if(SNAKES[final]){
    await sleep(140);sfxSnake();
    const dest=SNAKES[final];
    addLog(`🐍 ${p.name} ${final}→${dest}`,'bad');
    positions[current]=dest;updateTokens();
    const tok=document.querySelector(`.token.p${current+1}`);
    if(tok){tok.classList.add('bounce');setTimeout(()=>tok.classList.remove('bounce'),350)}
  }
  
  if(positions[current]===100){
    gameOver=true;clearInterval(timerInt);sfxWin();
    addLog(`🏆 ${p.name} MENANG`,'good');
    showEnd();isMoving=false;updateUI();return;
  }
  
  current=(current+1)%numPlayers;isMoving=false;updateUI();
}

function showEnd(){
  const p=players[current];
  document.getElementById('winTitle').textContent=`🎉 ${p.name} Menang!`;
  document.getElementById('winMsg').textContent=`Posisi 100 • ${document.getElementById('timer').textContent}`;
  
  const ranking=players.map((pl,i)=>({name:pl.name,color:pl.color,pos:positions[i]})).sort((a,b)=>b.pos-a.pos);
  document.getElementById('rankList').innerHTML=ranking.map((r,i)=>`
    <div class="rank-item"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'} <b style="color:${r.color}">${r.name}</b></span><span>Pos ${r.pos}</span></div>`).join('');
  
  document.getElementById('fullLog').innerHTML=gameLog.map(l=>`<div class="li ${l.type}"><span style="opacity:.45">${l.t}</span> ${l.txt}</div>`).join('');
  document.getElementById('winOverlay').classList.add('show');
  confetti();
}

function confetti(){
  const cols=['#22d3ee','#a855f7','#f59e0b','#ec4899','#22c55e','#fbbf24'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');el.className='confetti';
    el.style.left=Math.random()*100+'vw';el.style.background=cols[i%cols.length];
    el.style.width=(5+Math.random()*6)+'px';el.style.height=(5+Math.random()*6)+'px';
    el.style.animationDuration=(1.5+Math.random()*1.8)+'s';el.style.animationDelay=Math.random()*.4+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),3800);
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
